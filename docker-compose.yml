services:
  job-scraper-api:
    build: .
    container_name: job-scraper-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - REQUEST_TIMEOUT=15
      - MAX_RETRIES=3
      - MIN_REQUEST_INTERVAL=1.0
      # - HTTP_PROXY=http://user:pass@host:port
    volumes:
      - ./app/core/career_pages.json:/app/app/core/career_pages.json
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobscraper-n8n.rule=Host(`n8n.rebekhoffman-staffing.com`)"
      - "traefik.http.routers.jobscraper-n8n.entrypoints=websecure"
      - "traefik.http.routers.jobscraper-n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobscraper-n8n.loadbalancer.server.port=8000"
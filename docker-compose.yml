services:
  job-scraper-api:
    build: .
    container_name: job-scraper-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: &job-environment
      - DEBUG=false
      - REQUEST_TIMEOUT=15
      - MAX_RETRIES=3
      - MIN_REQUEST_INTERVAL=1.0
      # - HTTP_PROXY=http://user:pass@host:port
      - MONGODB_URL=${MONGODB_URL:-mongodb://rebekhoffman:xK9mP2vQ8nR5tL1wZ7yB4cF6hJ3sD0aE@2.24.78.108:27017/myappdb?authSource=admin}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-myappdb}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-xK9mP2vQ8nR5tL1wZ7yB4cF6hJ3sD0aE}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-0}
    extra_hosts: &job-extra-hosts
      - "host.docker.internal:host-gateway"
    volumes: &job-volumes
      - ./app/core/career_pages.json:/app/app/core/career_pages.json
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobscraper-n8n.rule=Host(`n8n.rebekhoffman-staffing.com`)"
      - "traefik.http.routers.jobscraper-n8n.entrypoints=websecure"
      - "traefik.http.routers.jobscraper-n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobscraper-n8n.loadbalancer.server.port=8000"

  job-scraper-worker:
    build: .
    container_name: job-scraper-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment: *job-environment
    extra_hosts: *job-extra-hosts
    volumes: *job-volumes
    restart: unless-stopped
    healthcheck:
      disable: true
    stop_grace_period: 30s

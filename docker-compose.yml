services:
  job-scraper-api:
    build: .
    container_name: job-scraper-api
    # ports:
    #   - "8000:8000"        # no longer needed — Traefik routes to it internally
    environment:
      - DEBUG=false
      - REQUEST_TIMEOUT=15
      - MAX_RETRIES=3
      - MIN_REQUEST_INTERVAL=1.0
      # - HTTP_PROXY=http://user:pass@host:port
    volumes:
      - ./app/core/career_pages.json:/app/app/core/career_pages.json
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jobscraper.rule=Host(`api.rebekhoffman-staffing.com`)"
      - "traefik.http.routers.jobscraper.entrypoints=websecure"
      - "traefik.http.routers.jobscraper.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobscraper.loadbalancer.server.port=8000"